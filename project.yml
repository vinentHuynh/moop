name: Moop
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
packages:
  MoopCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.9'
targets:
  Moop:
    type: application
    platform: iOS
    sources: [iOS/Moop]
    dependencies:
      - package: MoopCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.moop
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: 1
schemes:
  Moop:
    build:
      targets:
        Moop: all
